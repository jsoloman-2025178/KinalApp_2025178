<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Formulario Usuario</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <img src="/logo.png" alt="KinalApp">
    </div>
    <h2>KinalApp</h2>
    <nav>
        <a href="/clientes">👥 Clientes</a>
        <a href="/productos">📦 Productos</a>
        <a href="/ventas">💰 Ventas</a>
        <a href="/usuarios">👤 Usuarios</a>
    </nav>
</div>

<div class="main-content">
    <div class="header">
        <h1 th:text="${titulo}">Usuarios</h1>
        <a href="/logout" class="logout-btn">Cerrar Sesión</a>
    </div>

    <div class="card">
        <form th:action="@{${usuario.codigoUsuario != null} ? '/usuarios/actualizar/' + ${usuario.codigoUsuario} : '/usuarios/guardar'}"
              th:object="${usuario}"
              method="post">

            <div class="form-group">
                <label>Nombre de Usuario:</label>
                <input type="text" th:field="*{username}" required>
            </div>

            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" required>
            </div>

            <div class="form-group">
                <label>Rol:</label>
                <input type="text" th:field="*{rol}" placeholder="ADMIN, VENDEDOR, etc." required>
            </div>

            <div class="form-group">
                <label>Estado:</label>
                <select th:field="*{estado}">
                    <option th:value="1">Activo</option>
                    <option th:value="0">Inactivo</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">💾 Guardar</button>
            <a href="/usuarios" class="btn-cancel">❌ Cancelar</a>
        </form>
    </div>
</div>
</body>
</html>
