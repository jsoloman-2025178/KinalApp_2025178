<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas - KinalApp</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="sidebar">
    <div class="logo">
        <img src="/logo.png" alt="KinalApp">
    </div>
    <h2>KinalApp</h2>
    <nav>
        <a href="/clientes"><i class="fas fa-users"></i> Clientes</a>
        <a href="/productos"><i class="fas fa-box"></i> Productos</a>
        <a href="/ventas"><i class="fas fa-shopping-cart"></i> Ventas</a>
        <a href="/usuarios"><i class="fas fa-user-cog"></i> Usuarios</a>
    </nav>
</div>

<div class="main-content">
    <div class="header">
        <h1>💰 Historial de Ventas</h1>
        <a href="/logout" class="logout-btn">Cerrar Sesión</a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr><th>Código Venta</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Usuario</th></tr>
            </thead>
            <tbody>
            <tr th:each="venta : ${ventas}">
                <td th:text="${venta.codigoVenta}"></td>
                <td th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy')}"></td>
                <td th:text="${venta.cliente != null ? venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente : 'N/A'}"></td>
                <td th:text="'Q' + ${venta.total}"></td>
                <td>
                    <span th:if="${venta.estado == 1}" class="badge-active">✅ Activa</span>
                    <span th:if="${venta.estado == 0}" class="badge-inactive">❌ Cancelada</span>
                </td>
                <td th:text="${venta.usuario != null ? venta.usuario.username : 'N/A'}"></td>
            </tr>
            <tr th:if="${ventas.isEmpty()}">
                <td colspan="6" class="empty">No hay ventas registradas</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
