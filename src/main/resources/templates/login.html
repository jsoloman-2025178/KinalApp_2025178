<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - KinalApp</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: white; border-radius: 10px; padding: 40px; width: 400px; text-align: center; }
        .logo img { width: 80px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .error { color: #e74c3c; margin: 10px 0; }
        .success { color: #2ecc71; margin: 10px 0; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <img src="/logo.png" alt="KinalApp">
    </div>
    <h2>🔐 KinalApp</h2>

    <div th:if="${param.error}" class="error">
        ❌ Usuario o contraseña incorrectos
    </div>

    <form method="post" action="/login">
        <input type="text" name="username" placeholder="Usuario" required autofocus>
        <input type="password" name="password" placeholder="Contraseña" required>
        <button type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
